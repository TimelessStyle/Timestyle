name: Website veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Projektordner finden und bauen
        run: |
          echo "Repo-Inhalt:"; ls -la
          B=$(find . -maxdepth 3 -name build.mjs -not -path '*/node_modules/*' | head -1)
          if [ -z "$B" ]; then echo "FEHLER: build.mjs wurde im Repository nicht gefunden."; exit 1; fi
          DIR=$(dirname "$B")
          echo "Projektordner: $DIR"
          cd "$DIR"
          node build.mjs
          echo "DIST_DIR=$(pwd)/dist" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
